# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  # 生产环境建议通过环境变量 RUOYI_PROFILE 指定为对象存储挂载点或独立磁盘
  profile: ${RUOYI_PROFILE:D:/ruoyi/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口（8080被IIS占用，改用8081）
  port: 8081
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# AI大模型配置
# 注意：API Key 通过环境变量注入，不提交到仓库
ai:
  # 模型提供商: deepseek / openai / zhipu / qwen
  web-search-enabled: false
  search-engine: bocha
  search-api-key: ${BOCHA_API_KEY:}
  search-result-count: 5
  provider: deepseek
  # API Key：设置环境变量 DEEPSEEK_API_KEY=sk-xxx 后启动
  api-key: ${DEEPSEEK_API_KEY:}
  # 模型名称
  model: deepseek-chat
  # API基础地址
  base-url: https://api.deepseek.com
  api-url: https://api.deepseek.com/chat/completions
  # 系统角色设定（智学星途AI助手人设）
  system-prompt: |
    你是"智学星途"AI学习助手，专门为学生和教师提供学习辅导服务。
    你的职责包括：
    1. 解答学习中的疑问，提供清晰易懂的解释
    2. 辅助作业辅导，引导学生思考而非直接给答案
    3. 推荐学习资源和复习计划
    4. 分析错题原因，提供针对性建议
    5. 用友好、鼓励的语气与用户交流
    请用中文回答，回答要简洁明了、条理清晰。
# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid,local
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # Spring MVC 配置
  mvc:
    # 静态资源匹配模式:仅 /static/** 走静态资源,避免 /captchaImage 等 Controller 路径
    # 被默认的 ResourceHttpRequestHandler 误判为"No static resource"
    static-path-pattern: /static/**
  web:
    resources:
      add-mappings: true
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: ${REDIS_HOST:localhost}
      # 端口，默认为6379
      port: ${REDIS_PORT:6379}
      # 数据库索引
      database: 0
      # 密码（生产环境通过环境变量 REDIS_PASSWORD 注入）
      password: ${REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（生产环境必须通过环境变量 JWT_SECRET 注入高强度随机串，不要用默认值）
  secret: ${JWT_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*


